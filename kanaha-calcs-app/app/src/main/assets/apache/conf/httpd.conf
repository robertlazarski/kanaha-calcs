# Apache httpd Configuration for Kanaha Calcs
# Localhost HTTPS + HTTP/2 for Axis2/C JSON calculation service
#
# Why HTTPS: Axis2/C JSON processing requires HTTP/2, which the in-app
# HC5 client only negotiates via ALPN over TLS. The listener is bound to
# all interfaces and protected by mTLS (SSLVerifyClient require) against the
# Kanaha CA -- identical security posture to kanaha-camera and kanaha-audio. Port 8444 (not 8443) so calcs can coexist with the camera
# app on one device without a listener collision.
#
# Modules statically linked — no LoadModule directives needed:
#   mod_authz_core, mod_dir, mod_mime, mod_log_config, mod_headers,
#   mod_unixd, mod_ssl, mod_http2, mod_rewrite, mod_axis2

# ServerRoot set via -d command line argument
PidFile "logs/httpd.pid"
ErrorLog "logs/error_log"
LogLevel warn

# HTTPS on port 8444 (all interfaces; mTLS-gated). Intentional: in "server
# mode" calcs is a peer of kanaha-camera / kanaha-audio and is meant to be
# driven remotely (curl/MCP), so it binds all interfaces like they do. The
# WebView UI is the optional "standalone mode". No certificate or key ships
# in the APK: the device mints its own key and CSR on first run, an operator
# signs it with the off-device Kanaha CA and pushes the cert and CA back into
# files/apache/ssl (see CertProvisioning.java). 8444 avoids colliding with the
# camera app's 8443 listener when both run on one device.
Listen 8444
ServerName localhost:8444

# Minimal document root
DocumentRoot "htdocs"
<Directory "htdocs">
    Require all granted
</Directory>

# Worker MPM — minimal for on-device use
<IfModule mpm_worker_module>
    StartServers          1
    MinSpareThreads       1
    MaxSpareThreads       4
    ThreadsPerChild       4
    MaxRequestWorkers     8
    MaxConnectionsPerChild 0
</IfModule>

# SSL — self-signed cert for localhost HTTP/2
SSLEngine on
SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1
SSLCipherSuite ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384
SSLCertificateFile "ssl/server.crt"
SSLCertificateKeyFile "ssl/server.key"
# Mutual TLS: require a client cert signed by the Kanaha CA.
SSLCACertificateFile "ssl/ca.crt"
SSLVerifyClient require
SSLVerifyDepth 2
SSLSessionCacheTimeout 300

# HTTP/2 over TLS (ALPN negotiation)
Protocols h2 http/1.1

# ========================================================================
# HTTP/2 Bomb hardening (CVE-2026-49975)
# Attack = HPACK indexed-reference bomb (cheap headers that each cost a full
# server allocation) + a zero-window flow-control stall that pins that memory.
# This listener is network-reachable (mTLS-gated) and an Android device's
# memory budget is tight, so we
# bound stream count, stall lifetime, and per-stream buffering. The real fix
# is mod_http2 >= 2.0.41 (counts Cookie crumbs against LimitRequestFields).
# ========================================================================
<IfModule http2_module>
    # Cap concurrent streams per connection well below the default of 100. The
    # bomb amplifies per stream; a small cap bounds the per-connection blast
    # radius. (The camera app uses 1; 8 leaves headroom for the calc WebView's
    # parallel fetches. Lower toward 1 if you see single-process hangs.)
    H2MaxSessionStreams 8

    # Bound how long a zero-window-stalled stream may live. This is an I/O
    # wait bound, not a compute bound: a request that keeps the handler busy
    # for longer is unaffected. Verified 2026-09-19 on a Pixel 10 Pro XL: a
    # monteCarlo of 1e6 x 900 steps ran 49 s inside mod_axis2 and returned
    # HTTP/2 200 with this value and Timeout 30 below. Do not raise either
    # to "allow" long calculations; they already are allowed.
    H2StreamTimeout 30

    # Cap per-stream outgoing buffer so a stalled response can't pin much RAM.
    H2StreamMaxMemSize 65536

    # Smaller flow-control window -> lower per-stream memory.
    H2WindowSize 65535
</IfModule>

# Axis2/C — Financial Benchmark Service
<IfModule axis2_module>
    Axis2RepoPath "axis2c"
    Axis2LogFile "logs/axis2.log"
    Axis2LogLevel info
    Axis2MaxLogFileSize 1048576
    Axis2GlobalPoolSize 8388608
    Axis2ServiceURLPrefix "/services"
</IfModule>

<Location "/services">
    Require all granted
    SetHandler axis2_module
    Header always set Cache-Control "no-cache, no-store, must-revalidate"
</Location>

# Keep alive for persistent WebView connections
KeepAlive On
MaxKeepAliveRequests 100
KeepAliveTimeout 5

# Request size limits (also the per-stream blast-radius cap for CVE-2026-49975:
# LimitRequestFieldSize caps the merged Cookie, bounding HTTP/2 crumb count).
LimitRequestBody 65536
LimitRequestFieldSize 4096
LimitRequestFields 50
LimitRequestLine 4096
# Socket I/O wait, not handler time (see the H2StreamTimeout note above).
# The Java client's 120 s wait in Axis2Client is the only compute bound.
Timeout 30

# Log format
LogFormat "%h %t \"%r\" %>s %b" common
CustomLog "logs/access_log" common
